name: Supabase & Render Keep-Alive

on:
  schedule:
    # Runs at 00:00 UTC every 2 days (well within Supabase's 7-day inactivity window)
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

# Secrets are hoisted to workflow-level env so the per-step `if` guards can
# read them: step-level `env:` is applied AFTER the `if` is evaluated, so
# referencing secrets there silently disabled every step of this workflow.
env:
  RENDER_URL: ${{ secrets.RENDER_APP_URL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  keep-alive:
    name: Ping Services
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service
        if: env.RENDER_URL != ''
        run: |
          echo "Pinging Render App..."
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "${RENDER_URL%/}/api/health" || true)
          echo "Render health check response code: $STATUS"

      - name: Ping Supabase REST API
        if: env.SUPABASE_URL != ''
        run: |
          echo "Pinging Supabase..."
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/" || true)
          echo "Supabase response code: $STATUS"
